{{ define "main" }}
<article class="article-page">
  <header class="article-header"><a class="back-link" href="{{ "/posts/" | relURL }}">← 所有文章</a><div class="article-meta"><span>{{ .Date.Format "2006 / 01 / 02" }}</span><span>{{ .ReadingTime }} 分钟阅读</span>{{ with .Params.tags }}<span>{{ delimit . " · " }}</span>{{ end }}</div><h1>{{ .Title }}</h1>{{ with .Description }}<p class="article-deck">{{ . }}</p>{{ end }}</header>
  <div class="article-layout"><aside class="article-aside"><span class="aside-label">目录</span><nav class="toc">{{ .TableOfContents }}</nav><div class="article-note">写于<br>{{ .Date.Format "2006 年 01 月" }}</div></aside><div class="article-body">{{ .Content }}<div class="article-signoff"><img src="{{ "/images/avatar.svg" | relURL }}" alt=""><div><strong>林默</strong><span>保持好奇，持续写作。</span></div></div></div></div>
</article>
{{ end }}
